sudo : required 
services:
  - docker

before_install:
  - docker build -t hany/react-test -f ./client/Dockerfile.dev ./client

script:
  - docker run -e CI=true hany/react-test npm test

after_success:
  - docker build -t hany/multi-client ./client
  - docker build -t hany/multi-nginx ./nginx
  - docker build -t hany/multi-server ./server
  - docker build -t hany/multi-worker ./worker

language: generic